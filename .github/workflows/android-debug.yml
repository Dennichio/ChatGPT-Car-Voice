name: Android debug build

on:
  push:
    branches: [main, feature/default-android-voice-assistant]
  pull_request:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build debug APK, unit tests and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-car-voice-0.3.0-dev-debug
          path: app/build/outputs/apk/debug/*.apk
